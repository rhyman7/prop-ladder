name: Debug one prop
# By hand only. Dumps every book's raw quotes for one player prop (~1 object per event).
on:
  workflow_dispatch:
    inputs:
      league: {default: "NBA"}
      player: {default: "LaMelo Ball"}
      stat: {default: "points+rebounds+assists"}
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          LEAGUE: ${{ inputs.league }}
          PLAYER: ${{ inputs.player }}
          STAT: ${{ inputs.stat }}
        run: python scripts/debug_prop.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add coverage/debug_prop.json && git commit -m "Debug prop dump" || true
          git pull --rebase -q && git push
