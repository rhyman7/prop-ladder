name: Kalshi discovery
# By hand only. Lists Kalshi's football/basketball player-prop series (public API, no key).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/kalshi_discover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add coverage/kalshi_discover.json && git commit -m "Kalshi discovery" || true
          git pull --rebase -q && git push
