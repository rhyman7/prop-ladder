name: fairOdds check (SportsGameOdds)

# Run by hand only. Compares SGO's fairOdds with our own vig removal and counts
# how many ladder rungs have two-sided quotes. About 1 SGO object per event,
# capped at 63 events per run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python scripts/fairodds_check.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add coverage
          git commit -m "fairOdds check report" || echo "nothing to commit"
          git push
